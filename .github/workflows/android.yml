name: APK do Meu Controle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Definir versão do APK
        id: version
        run: echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
      - name: Gerar APK assinado
        working-directory: android
        env:
          ANDROID_SIGNING_P12: ${{ secrets.ANDROID_SIGNING_P12 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.code }}
        run: |
          test -n "$ANDROID_SIGNING_P12"
          test -n "$ANDROID_SIGNING_PASSWORD"
          export ANDROID_SIGNING_FILE="$RUNNER_TEMP/meu-controle.p12"
          umask 077
          trap 'rm -f "$ANDROID_SIGNING_FILE"' EXIT
          printf '%s' "$ANDROID_SIGNING_P12" | base64 --decode > "$ANDROID_SIGNING_FILE"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/meu-controle-android.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify "$RUNNER_TEMP/meu-controle-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-controle-android
          path: ${{ runner.temp }}/meu-controle-android.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meu-controle-android
      - name: Publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="android-$APK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" meu-controle-android.apk --target "$GITHUB_SHA" \
            --title "Meu Controle Android $APK_VERSION" --generate-notes --latest
